<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multiplayer Grid Game</title>
  
  <!-- 1. Networking and p5 Libraries -->
  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js" type="text/javascript"></script>
  
  <!-- 2. Your Game Files -->
  <script src="main.js" type="text/javascript"></script>
  <script src="powers.js" type="text/javascript"></script>
  <script src="power ablitiys.js" type="text/javascript"></script>
  <script src="animations.js" type="text/javascript"></script>
  <script src="UI.js" type="text/javascript"></script>
  <script src="Event power.js" type="text/javascript"></script>
  <script src="Event ablitys.js" type="text/javascript"></script>
  <script src="Dev term.js" type="text/javascript"></script>
  
  <!-- 3. Your Network File -->
  <script src="network.js" type="text/javascript"></script>

  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      margin: 0; 
      background: #222; 
      color: #fff; 
      overflow: hidden; /* Prevents scrollbars when canvas is injected */
    }
    
    #lobby-ui {
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      position: absolute; 
      top: 0;
      left: 0;
      z-index: 100; 
      background: #14191e; 
      width: 100vw; 
      height: 100vh; 
    }

    .lobby-box { 
      margin: 20px; 
      padding: 20px; 
      background: #2a3441; 
      border-radius: 8px; 
      width: 300px;
    }

    button { 
      padding: 10px 20px; 
      margin: 10px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 16px;
    }

    input { 
      padding: 10px; 
      font-size: 16px; 
      text-align: center; 
      width: 80%; 
      text-transform: uppercase;
    }

    #room-code-display {
      font-weight: bold; 
      color: #ffeb3b; 
      letter-spacing: 2px; 
      font-size: 24px;
      margin-top: 15px;
    }

    #network-status {
      color: #aaa;
      margin-top: 15px;
      font-size: 18px;
    }

    #game-screen { 
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <!-- The Multiplayer Lobby Screen -->
  <div id="lobby-ui">
    <h2>Multiplayer Lobby</h2>
    
    <div class="lobby-box">
      <h3>Host a Game</h3>
      <button onclick="hostRoom()">Create Room</button>
      <p id="room-code-display"></p>
    </div>

    <div class="lobby-box">
      <h3>Join a Game</h3>
      <input type="text" id="join-code" placeholder="Enter Room Code">
      <br>
      <button onclick="joinRoom()">Join</button>
    </div>
    
    <p id="network-status"></p>
  </div>

  <!-- The Game Screen -->
  <div id="game-screen">
    <!-- p5.js will inject your canvas right here -->
  </div>

</body>
</html>
