<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Multiplayer Grid Game</title>
  
  <!-- 1. Networking and p5 Libraries -->
  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js" type="text/javascript"></script>
  
  <!-- 2. Your Game Files -->
  <script src="main.js" type="text/javascript"></script>
  <script src="powers.js" type="text/javascript"></script>
  <script src="power ablitiys.js" type="text/javascript"></script>
  <script src="animations.js" type="text/javascript"></script>
  <script src="UI.js" type="text/javascript"></script>
  <script src="Event power.js" type="text/javascript"></script>
  <script src="Event ablitys.js" type="text/javascript"></script>
  <script src="Dev term.js" type="text/javascript"></script>
  
  <!-- 3. Your New Network File (Create this next!) -->
  <script src="network.js" type="text/javascript"></script>

  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #222; color: #fff; }
    #game-screen { display: none; }
    .lobby-box { margin: 20px auto; padding: 20px; background: #333; border-radius: 8px; max-width: 300px; }
    button { padding: 10px 20px; margin: 10px; cursor: pointer; font-weight: bold; }
    input { padding: 10px; font-size: 16px; text-align: center; width: 80%; }
  </style>
</head>
<body>

  <!-- The Multiplayer Lobby Screen -->
  <div id="lobby-screen">
    <h1>Game Lobby</h1>
    
    <div class="lobby-box">
      <button onclick="hostGame()">Create Room</button>
      <p id="room-code-display">Code will appear here.</p>
    </div>

    <div class="lobby-box">
      <input type="text" id="join-code" placeholder="Enter Room Code">
      <br>
      <button onclick="joinGame()">Join Room</button>
    </div>
  </div>

  <!-- The Game Screen -->
  <div id="game-screen">
    <!-- p5.js will inject your canvas right here -->
  </div>

</body>
</html>
